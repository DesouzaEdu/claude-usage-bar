name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh --arch arm64 --arch x86_64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/ClaudeUsageBar.zip --generate-notes
